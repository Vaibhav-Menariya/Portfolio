<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0c2136"/>
      <stop offset="60%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- Circuit grid traces -->
  <g stroke="#06b6d4" stroke-width="1" stroke-opacity="0.15" fill="none">
    <path d="M 50 100 L 120 100 L 150 70 L 250 70 L 280 100 L 350 100" />
    <path d="M 40 200 L 100 200 L 130 230 L 270 230 L 300 200 L 360 200" />
    <path d="M 80 320 L 140 320 L 170 350 L 230 350 L 260 320 L 320 320" />
    <circle cx="150" cy="70" r="3" fill="#38bdf8" fill-opacity="0.5"/>
    <circle cx="250" cy="70" r="3" fill="#38bdf8" fill-opacity="0.5"/>
    <circle cx="100" cy="200" r="3" fill="#06b6d4" fill-opacity="0.5"/>
    <circle cx="300" cy="200" r="3" fill="#06b6d4" fill-opacity="0.5"/>
  </g>

  <!-- Hexagonal Silicon Frame -->
  <polygon points="200,30 350,115 350,285 200,370 50,285 50,115" 
           fill="none" stroke="url(#cyberCyan)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 4"/>

  <!-- Engineer Silhouette -->
  <!-- Shoulders / Torso -->
  <path d="M 100 370 C 100 300, 140 270, 200 270 C 260 270, 300 300, 300 370 Z" 
        fill="#0d1b2a" stroke="url(#cyberCyan)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Collar / Tech Suit Lines -->
  <path d="M 165 275 L 200 315 L 235 275" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <line x1="200" y1="315" x2="200" y2="370" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Neck -->
  <rect x="185" y="215" width="30" height="65" rx="5" fill="#132338"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="170" rx="55" ry="68" fill="#1b2f4a" stroke="url(#cyberCyan)" stroke-width="1.5"/>

  <!-- Modern Hair Style -->
  <path d="M 145 160 C 145 105, 170 95, 205 95 C 240 95, 255 110, 255 145 C 245 130, 230 120, 210 120 C 180 120, 160 135, 145 160 Z" 
        fill="#0a121e" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Cyber Visor / Smart Glass Overlay -->
  <path d="M 160 155 L 240 155 C 245 155, 245 170, 240 170 L 160 170 C 155 170, 155 155, 160 155 Z" 
        fill="#06b6d4" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="168" y1="162" x2="232" y2="162" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="236" cy="162" r="2" fill="#fbbf24"/>

  <!-- Ear detail -->
  <path d="M 145 160 Q 140 175 146 185" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 255 160 Q 260 175 254 185" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Silicon Pinout Accents on frame -->
  <circle cx="200" cy="30" r="4" fill="#fbbf24"/>
  <circle cx="350" cy="115" r="4" fill="#38bdf8"/>
  <circle cx="350" cy="285" r="4" fill="#38bdf8"/>
  <circle cx="200" cy="370" r="4" fill="#fbbf24"/>
  <circle cx="50" cy="285" r="4" fill="#38bdf8"/>
  <circle cx="50" cy="115" r="4" fill="#38bdf8"/>

  <!-- Badge text -->
  <text x="200" y="388" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    VAIBHAV // CORE_DIE
  </text>
</svg>
